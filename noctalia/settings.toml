config_version = 16

[bar.default]
center = [ "caffeine", "clock" ]
concave_edge_corners = false
end = [ "clipboard", "network", "bluetooth", "volume", "battery", "session" ]
margin_edge = 1
scale = 0.90000000596046448
start = [ "workspaces" ]
thickness = 28

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 719.99993896484375
    cy = 718.00006103515625
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
enabled = false

[shell]
corner_radius_scale = 0.5000000074505806
font_family = "IBM Plex Sans"

    [shell.animation]
    enabled = false

[theme]
builtin = "Rosé Pine"
community_palette = "Oxocarbon"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/silfa/Pictures/Wallpapers/building.jpg"

[wallpaper.last]
path = "/home/silfa/Pictures/Wallpapers/building.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/silfa/Pictures/Wallpapers/building.jpg"

[widget.workspaces]
hide_when_empty = true