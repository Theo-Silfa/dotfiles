# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# make copy like in vim
set-window-option -g mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

# reload config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm-256color:Tc"

# for OSC52 to work
set -s set-clipboard on

# cwd for split panes
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# get rid of esc key delay
set -sg escape-time 10

# indexing windows starts from 1 instead of 0
set -g base-index 1

# enable focus events so vim can detect file changes
set -g focus-events on

# Smart pane switching with awareness of Vim splits.
set -g @plugin 'mrjones2014/smart-splits.nvim'

# status bar
set -g @plugin 'niksingh710/minimal-tmux-status'
# rosepine main foam
set -g @minimal-tmux-bg "#9ccfd8"
# hostname on the right
set -g @minimal-tmux-status-right-extra " > #H  "

#tpm itself
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'